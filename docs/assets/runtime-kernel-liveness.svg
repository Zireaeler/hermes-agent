<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Runtime liveness invariant</title>
  <desc id="desc">Legal waiting states and illegal idle state that triggers liveness violation.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#334155"/>
    </marker>
    <style>
      .title{font:700 24px Arial,sans-serif;fill:#111827}
      .label{font:700 15px Arial,sans-serif;fill:#111827}
      .small{font:13px Arial,sans-serif;fill:#334155}
      .ok{fill:#f0fdf4;stroke:#16a34a;stroke-width:1.8;rx:8}
      .warn{fill:#fffbeb;stroke:#d97706;stroke-width:1.8;rx:8}
      .bad{fill:#fef2f2;stroke:#dc2626;stroke-width:1.8;rx:8}
      .core{fill:#ecfeff;stroke:#0891b2;stroke-width:2;rx:10}
      .flow{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1120" height="620" fill="#ffffff"/>
  <text x="40" y="44" class="title">Liveness: A Job May Stop Only for a Legal Reason</text>

  <rect x="430" y="95" width="280" height="120" class="core"/>
  <text x="462" y="130" class="label">Job Not Done?</text>
  <text x="462" y="158" class="small">Required goal gaps remain</text>
  <text x="462" y="180" class="small">Completion rule is false</text>

  <rect x="70" y="305" width="200" height="98" class="ok"/>
  <text x="92" y="338" class="label">ready node</text>
  <text x="92" y="366" class="small">Can materialize task</text>
  <text x="92" y="388" class="small">Legal progress state</text>

  <rect x="325" y="305" width="200" height="98" class="ok"/>
  <text x="347" y="338" class="label">running node</text>
  <text x="347" y="366" class="small">Waiting worker</text>
  <text x="347" y="388" class="small">Legal wait state</text>

  <rect x="580" y="305" width="200" height="98" class="ok"/>
  <text x="602" y="338" class="label">human gate</text>
  <text x="602" y="366" class="small">Policy-approved</text>
  <text x="602" y="388" class="small">Legal wait state</text>

  <rect x="835" y="305" width="200" height="98" class="warn"/>
  <text x="857" y="338" class="label">pending decision</text>
  <text x="857" y="366" class="small">Provider call in flight</text>
  <text x="857" y="388" class="small">Recoverable wait</text>

  <rect x="430" y="475" width="280" height="90" class="bad"/>
  <text x="462" y="508" class="label">liveness_violation</text>
  <text x="462" y="536" class="small">No ready/running/human/decision</text>
  <text x="462" y="558" class="small">but open goal gaps remain</text>

  <path d="M570 215 C470 250 270 292 170 305" class="flow"/>
  <path d="M570 215 C520 255 440 286 425 305" class="flow"/>
  <path d="M570 215 C615 255 660 285 680 305" class="flow"/>
  <path d="M570 215 C710 250 870 288 935 305" class="flow"/>
  <path d="M570 215 C570 335 570 430 570 475" class="flow"/>

  <text x="740" y="529" class="small">This is not job failure. It is a structural signal asking for gap resolution.</text>
</svg>
