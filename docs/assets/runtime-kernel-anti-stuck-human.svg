<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
  <title id="title">Anti-stuck and human gate policy</title>
  <desc id="desc">Stagnation detection and controlled human gate conditions.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#334155"/>
    </marker>
    <style>
      .title{font:700 24px Arial,sans-serif;fill:#111827}
      .label{font:700 15px Arial,sans-serif;fill:#111827}
      .small{font:13px Arial,sans-serif;fill:#334155}
      .tiny{font:12px Arial,sans-serif;fill:#475569}
      .bad{fill:#fef2f2;stroke:#dc2626;stroke-width:1.8;rx:8}
      .warn{fill:#fffbeb;stroke:#d97706;stroke-width:1.8;rx:8}
      .ok{fill:#f0fdf4;stroke:#16a34a;stroke-width:1.8;rx:8}
      .core{fill:#ecfeff;stroke:#0891b2;stroke-width:2;rx:10}
      .flow{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1120" height="660" fill="#ffffff"/>
  <text x="40" y="44" class="title">Anti-Stuck Policy and Controlled Human Gates</text>

  <rect x="70" y="105" width="250" height="120" class="bad"/>
  <text x="95" y="139" class="label">Repeated No Progress</text>
  <text x="95" y="167" class="small">same gap attempt_count grows</text>
  <text x="95" y="189" class="small">no full/verified evidence</text>
  <text x="95" y="211" class="small">or repeated uncertain worker</text>

  <rect x="70" y="275" width="250" height="120" class="bad"/>
  <text x="95" y="309" class="label">Repeated Patch Failure</text>
  <text x="95" y="337" class="small">parse_failed</text>
  <text x="95" y="359" class="small">rejected_patch</text>
  <text x="95" y="381" class="small">graph revision unchanged</text>

  <rect x="430" y="190" width="280" height="130" class="core"/>
  <text x="462" y="226" class="label">Synthetic Audit Events</text>
  <text x="462" y="254" class="small">stale_or_no_progress</text>
  <text x="462" y="276" class="small">structure_audit_requested</text>
  <text x="462" y="298" class="small">strategy_update_requested</text>

  <rect x="800" y="105" width="250" height="120" class="ok"/>
  <text x="825" y="139" class="label">Continue Locally</text>
  <text x="825" y="167" class="small">create smaller debug node</text>
  <text x="825" y="189" class="small">insert verifier</text>
  <text x="825" y="211" class="small">try research path</text>

  <rect x="800" y="275" width="250" height="158" class="warn"/>
  <text x="825" y="309" class="label">Human Gate Allowed</text>
  <text x="825" y="337" class="small">missing_secret</text>
  <text x="825" y="359" class="small">external_cost / permission</text>
  <text x="825" y="381" class="small">destructive_change</text>
  <text x="825" y="403" class="small">product_preference</text>

  <rect x="430" y="470" width="280" height="98" class="bad"/>
  <text x="462" y="504" class="label">Not Allowed</text>
  <text x="462" y="532" class="small">Ask user for ordinary naming</text>
  <text x="462" y="554" class="small">Ask user because model is unsure</text>

  <path d="M320 165 C370 175 390 220 430 242" class="flow"/>
  <path d="M320 335 C370 330 390 295 430 276" class="flow"/>
  <path d="M710 240 C755 205 770 175 800 165" class="flow"/>
  <path d="M710 292 C755 318 770 350 800 354" class="flow"/>
  <path d="M570 320 C570 380 570 430 570 470" class="flow"/>

  <text x="70" y="612" class="small">Rule: human gate is a controlled blocker. It is not a generic escape hatch for hard engineering choices.</text>
</svg>
