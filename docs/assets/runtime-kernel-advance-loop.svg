<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Runtime advance loop</title>
  <desc id="desc">Bounded advance loop from ingest to reduce, materialize, decide, validate and exit.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#334155"/>
    </marker>
    <style>
      .title{font:700 24px Arial,sans-serif;fill:#111827}
      .label{font:700 15px Arial,sans-serif;fill:#111827}
      .small{font:13px Arial,sans-serif;fill:#334155}
      .box{fill:#f8fafc;stroke:#334155;stroke-width:1.5;rx:8}
      .green{fill:#f0fdf4;stroke:#16a34a;stroke-width:1.8;rx:8}
      .blue{fill:#eff6ff;stroke:#2563eb;stroke-width:1.8;rx:8}
      .amber{fill:#fffbeb;stroke:#d97706;stroke-width:1.8;rx:8}
      .red{fill:#fef2f2;stroke:#dc2626;stroke-width:1.8;rx:8}
      .flow{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1120" height="620" fill="#ffffff"/>
  <text x="40" y="44" class="title">advance_runtime_job(): One Bounded Tick</text>

  <rect x="55" y="110" width="185" height="96" class="green"/>
  <text x="78" y="143" class="label">1. Ingest Evidence</text>
  <text x="78" y="170" class="small">Read Kanban task snapshot</text>
  <text x="78" y="192" class="small">Write node event + ledger</text>

  <rect x="300" y="110" width="185" height="96" class="blue"/>
  <text x="323" y="143" class="label">2. Local Reducer</text>
  <text x="323" y="170" class="small">Readiness</text>
  <text x="323" y="192" class="small">Gaps, liveness, done</text>

  <rect x="545" y="110" width="185" height="96" class="green"/>
  <text x="568" y="143" class="label">3. Materialize</text>
  <text x="568" y="170" class="small">ready node -> task</text>
  <text x="568" y="192" class="small">idempotent active run</text>

  <rect x="790" y="110" width="185" height="96" class="blue"/>
  <text x="813" y="143" class="label">4. Reduce Again</text>
  <text x="813" y="170" class="small">State after task creation</text>
  <text x="813" y="192" class="small">Check decision need</text>

  <rect x="178" y="330" width="210" height="108" class="amber"/>
  <text x="202" y="363" class="label">5. Decision Session</text>
  <text x="202" y="390" class="small">Only if reducer requests</text>
  <text x="202" y="412" class="small">delta -> patch proposal</text>

  <rect x="455" y="330" width="210" height="108" class="red"/>
  <text x="479" y="363" class="label">6. Patch Validator</text>
  <text x="479" y="390" class="small">Schema + revision</text>
  <text x="479" y="412" class="small">Apply or reject</text>

  <rect x="732" y="330" width="210" height="108" class="box"/>
  <text x="756" y="363" class="label">7. Exit Reason</text>
  <text x="756" y="390" class="small">done / waiting_worker</text>
  <text x="756" y="412" class="small">waiting_human / decision</text>

  <path d="M240 158 L300 158" class="flow"/>
  <path d="M485 158 L545 158" class="flow"/>
  <path d="M730 158 L790 158" class="flow"/>
  <path d="M882 206 C840 270 760 310 665 350" class="flow"/>
  <path d="M790 206 C675 270 505 302 388 350" class="flow"/>
  <path d="M388 384 L455 384" class="flow"/>
  <path d="M665 384 L732 384" class="flow"/>
  <path d="M560 438 C550 505 370 510 330 438" class="flow"/>

  <text x="405" y="510" class="small">Applied patch returns to reducer; rejected patch becomes audit signal.</text>
  <rect x="55" y="520" width="920" height="48" fill="#f8fafc" stroke="#cbd5e1" rx="8"/>
  <text x="80" y="550" class="small">Important: node_completed is input to reducer. It is not automatically a provider call.</text>
</svg>
