<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
  <title id="title">Goal gap detector</title>
  <desc id="desc">Inputs and gap type classification for required goal items.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#334155"/>
    </marker>
    <style>
      .title{font:700 24px Arial,sans-serif;fill:#111827}
      .label{font:700 15px Arial,sans-serif;fill:#111827}
      .small{font:13px Arial,sans-serif;fill:#334155}
      .tiny{font:12px Arial,sans-serif;fill:#475569}
      .in{fill:#eef2ff;stroke:#4f46e5;stroke-width:1.6;rx:8}
      .core{fill:#ecfeff;stroke:#0891b2;stroke-width:2;rx:10}
      .gap{fill:#fff7ed;stroke:#ea580c;stroke-width:1.6;rx:8}
      .bad{fill:#fef2f2;stroke:#dc2626;stroke-width:1.6;rx:8}
      .ok{fill:#f0fdf4;stroke:#16a34a;stroke-width:1.6;rx:8}
      .flow{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1120" height="640" fill="#ffffff"/>
  <text x="40" y="44" class="title">detect_goal_gaps(): From Evidence to Open Goal Gaps</text>

  <rect x="55" y="95" width="220" height="92" class="in"/>
  <text x="78" y="128" class="label">Goal Items</text>
  <text x="78" y="155" class="small">required / optional</text>
  <text x="78" y="177" class="small">verifier_required</text>

  <rect x="55" y="225" width="220" height="92" class="in"/>
  <text x="78" y="258" class="label">Progress Ledger</text>
  <text x="78" y="285" class="small">satisfaction</text>
  <text x="78" y="307" class="small">verification_state</text>

  <rect x="55" y="355" width="220" height="92" class="in"/>
  <text x="78" y="388" class="label">Graph Frontier</text>
  <text x="78" y="415" class="small">ready / running</text>
  <text x="78" y="437" class="small">failed / waiting_human</text>

  <rect x="380" y="205" width="280" height="150" class="core"/>
  <text x="415" y="242" class="label">Gap Classifier</text>
  <text x="415" y="270" class="small">Per required goal item</text>
  <text x="415" y="292" class="small">Stable gap_key</text>
  <text x="415" y="314" class="small">Upsert goal_gaps</text>
  <text x="415" y="336" class="small">Emit goal_gap_detected once</text>

  <rect x="755" y="75" width="280" height="58" class="gap"/>
  <text x="780" y="111" class="label">missing_evidence</text>
  <rect x="755" y="145" width="280" height="58" class="gap"/>
  <text x="780" y="181" class="label">partial_evidence</text>
  <rect x="755" y="215" width="280" height="58" class="gap"/>
  <text x="780" y="251" class="label">needs_verification</text>
  <rect x="755" y="285" width="280" height="58" class="bad"/>
  <text x="780" y="321" class="label">verification_failed</text>
  <rect x="755" y="355" width="280" height="58" class="bad"/>
  <text x="780" y="391" class="label">contradicted_evidence</text>
  <rect x="755" y="425" width="280" height="58" class="bad"/>
  <text x="780" y="461" class="label">failed_required_node</text>
  <rect x="755" y="495" width="280" height="58" class="ok"/>
  <text x="780" y="531" class="label">blocked_by_human_gate</text>
  <rect x="755" y="565" width="280" height="48" class="bad"/>
  <text x="780" y="596" class="label">no_runnable_for_open_goal</text>

  <path d="M275 141 C330 150 350 210 380 244" class="flow"/>
  <path d="M275 271 C325 271 345 280 380 280" class="flow"/>
  <path d="M275 401 C330 390 350 336 380 314" class="flow"/>
  <path d="M660 280 C700 175 710 115 755 104" class="flow"/>
  <path d="M660 280 C705 220 710 178 755 174" class="flow"/>
  <path d="M660 280 C705 252 718 245 755 244" class="flow"/>
  <path d="M660 280 C705 302 720 312 755 314" class="flow"/>
  <path d="M660 280 C704 348 714 383 755 384" class="flow"/>
  <path d="M660 280 C704 410 716 450 755 454" class="flow"/>
  <path d="M660 280 C690 475 710 520 755 524" class="flow"/>
  <path d="M660 280 C690 542 710 588 755 589" class="flow"/>

  <text x="390" y="590" class="small">Gap rows are a persisted view, not a plan. They explain why completion is not yet legal.</text>
</svg>
