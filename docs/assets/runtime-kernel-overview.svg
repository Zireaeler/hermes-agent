<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Runtime kernel architecture overview</title>
  <desc id="desc">Goal contract, progress ledger, execution graph, event log, decision session, validator and Kanban workers.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#334155"/>
    </marker>
    <style>
      .title{font:700 24px Arial,sans-serif;fill:#111827}
      .label{font:700 16px Arial,sans-serif;fill:#111827}
      .small{font:13px Arial,sans-serif;fill:#334155}
      .tiny{font:12px Arial,sans-serif;fill:#475569}
      .box{fill:#f8fafc;stroke:#334155;stroke-width:1.5;rx:8}
      .db{fill:#eef2ff;stroke:#4f46e5;stroke-width:1.8;rx:8}
      .kernel{fill:#ecfeff;stroke:#0891b2;stroke-width:1.8;rx:8}
      .worker{fill:#f0fdf4;stroke:#16a34a;stroke-width:1.8;rx:8}
      .guard{fill:#fff7ed;stroke:#ea580c;stroke-width:1.8;rx:8}
      .flow{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .soft{stroke:#94a3b8;stroke-width:1.5;fill:none;stroke-dasharray:6 5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1120" height="620" fill="#ffffff"/>
  <text x="40" y="44" class="title">Hermes Kanban Runtime Kernel: Goal-Driven Event-Sourced Runtime</text>

  <rect x="40" y="85" width="210" height="110" class="box"/>
  <text x="62" y="118" class="label">User / Main Agent</text>
  <text x="62" y="146" class="small">Creates job</text>
  <text x="62" y="168" class="small">Reads status</text>
  <text x="62" y="190" class="small">Provides human decisions</text>

  <rect x="325" y="75" width="300" height="170" class="kernel"/>
  <text x="350" y="108" class="label">Runtime Kernel</text>
  <text x="350" y="136" class="small">advance_runtime_job()</text>
  <text x="350" y="158" class="small">reduce_runtime_job()</text>
  <text x="350" y="180" class="small">detect_goal_gaps()</text>
  <text x="350" y="202" class="small">materialize / ingest evidence</text>
  <text x="350" y="224" class="small">owns readiness and completion</text>

  <rect x="735" y="75" width="300" height="170" class="db"/>
  <text x="760" y="108" class="label">Authoritative DB State</text>
  <text x="760" y="136" class="small">goal_contracts + goal_items</text>
  <text x="760" y="158" class="small">progress_ledger + goal_gaps</text>
  <text x="760" y="180" class="small">execution graph + events</text>
  <text x="760" y="202" class="small">patches + decisions + artifacts</text>
  <text x="760" y="224" class="small">source of truth for recovery</text>

  <rect x="55" y="325" width="255" height="150" class="worker"/>
  <text x="80" y="358" class="label">Kanban Execution Layer</text>
  <text x="80" y="386" class="small">tasks, runs, dispatcher</text>
  <text x="80" y="408" class="small">worker lanes, heartbeat</text>
  <text x="80" y="430" class="small">timeout, crash, evidence</text>
  <text x="80" y="452" class="small">does not decide global graph</text>

  <rect x="420" y="330" width="260" height="145" class="guard"/>
  <text x="445" y="363" class="label">Decision Session</text>
  <text x="445" y="391" class="small">non-authoritative context</text>
  <text x="445" y="413" class="small">stable prefix + checkpoint</text>
  <text x="445" y="435" class="small">DB-derived delta append</text>
  <text x="445" y="457" class="small">returns patch proposal only</text>

  <rect x="775" y="330" width="260" height="145" class="guard"/>
  <text x="800" y="363" class="label">Patch Validator</text>
  <text x="800" y="391" class="small">checks revision and schema</text>
  <text x="800" y="413" class="small">rejects release_node</text>
  <text x="800" y="435" class="small">rejects direct complete_job</text>
  <text x="800" y="457" class="small">applies valid graph patches</text>

  <path d="M250 140 C280 140 295 140 325 140" class="flow"/>
  <path d="M625 150 C665 150 695 150 735 150" class="flow"/>
  <path d="M735 205 C675 255 610 290 560 330" class="soft"/>
  <path d="M680 402 C715 402 740 402 775 402" class="flow"/>
  <path d="M775 455 C690 535 430 535 310 455" class="flow"/>
  <path d="M325 210 C240 260 205 285 183 325" class="flow"/>
  <path d="M310 365 C355 330 385 270 430 245" class="flow"/>
  <path d="M1035 402 C1070 305 1015 255 975 245" class="flow"/>

  <text x="274" y="128" class="tiny">objective</text>
  <text x="646" y="138" class="tiny">state writes</text>
  <text x="600" y="283" class="tiny">delta</text>
  <text x="704" y="390" class="tiny">patch proposal</text>
  <text x="584" y="548" class="tiny">valid patch changes graph; invalid patch is only an event</text>
  <text x="206" y="286" class="tiny">ready node becomes Kanban task</text>
  <text x="316" y="330" class="tiny">evidence returns</text>
  <text x="1008" y="286" class="tiny">validated DB update</text>

  <rect x="40" y="540" width="995" height="48" fill="#f8fafc" stroke="#cbd5e1" rx="8"/>
  <text x="62" y="570" class="small">Core invariant: DB owns facts. Reducer owns readiness, gaps, liveness and completion. LLM/session only proposes patches.</text>
</svg>
